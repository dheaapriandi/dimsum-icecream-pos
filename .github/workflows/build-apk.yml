name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" || true
          sdkmanager --list | head -30

      - name: Install NPM Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Ensure gradlew executable
        run: chmod +x android/gradlew

      - name: Capacitor Copy (web assets)
        run: npx cap copy android

      - name: Capacitor Update (native plugins)
        run: npx cap update android

      - name: Build Android Debug APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/Kedai-AA-POS.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kedai-AA-POS-APK
          path: build-output/Kedai-AA-POS.apk
          retention-days: 30

      - name: Publish Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0-apk
          name: "Kedai AA POS - Android APK (Terbaru)"
          body: |
            ### 📱 Berkas Aplikasi Android (APK) Kedai AA POS
            Unduh file `Kedai-AA-POS.apk` di bawah ini dan pasang pada HP / Tablet kasir Android Anda.
            
            - **Nama Aplikasi:** Kedai AA POS
            - **Package ID:** `com.kedaiaa.pos`
            - **Status:** Siap Digunakan
          files: |
            build-output/Kedai-AA-POS.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
